[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dissokin"
version = "0.1.0"
description = "Release kinetics model fitting for in vitro dissolution data, with information criterion model selection and bootstrap uncertainty"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kancharla Nithya Sri"}]
keywords = ["dissolution", "drug release", "pharmaceutics", "Korsmeyer-Peppas",
            "model selection", "AIC", "bootstrap", "f2 similarity"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
study = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["dissokin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
